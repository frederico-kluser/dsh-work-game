<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Original, modular office artwork. Every symbol is a separate, reusable SVG piece.
       Tables touch at x = 900. Repeat the desk symbol laterally; use connector at each join.
       CSS custom properties color the same geometry for any workspace. No raster furniture. -->
  <symbol id="desk" viewBox="0 0 900 288">
    <g stroke-linejoin="round" stroke-width="2.5">
      <path d="M21 137H879V278H21Z" fill="var(--desk-color, #2869a6)" stroke="var(--desk-stroke, #234b70)"/>
      <path d="M42 153H858V251H42Z" fill="var(--desk-panel, #25629b)" stroke="var(--desk-stroke, #234b70)"/>
      <rect x="17" y="138" width="19" height="148" rx="3" fill="var(--desk-color, #2869a6)" stroke="var(--desk-stroke, #234b70)"/>
      <rect x="864" y="138" width="19" height="148" rx="3" fill="var(--desk-color, #2869a6)" stroke="var(--desk-stroke, #234b70)"/>
      <path d="M27 10H873L898 118V128Q898 141 885 141H15Q2 141 2 128V118Z" fill="#bf9c77" stroke="#8a735d"/>
      <path d="M1 1H899V111Q900 125 884 125H16Q0 125 2 111Z" fill="#f0cca5" stroke="#92785e"/>
      <path d="M30 7H870" fill="none" stroke="#fbe3c9" stroke-width="3"/>
    </g>
  </symbol>
  <symbol id="chair" viewBox="0 0 174 198">
    <path d="M24 190L14 70Q11 9 56 5Q88-2 122 5Q166 8 162 70L153 190Z" fill="#254e77" stroke="#273b50" stroke-width="3"/>
    <path d="M32 166L25 71Q22 20 61 17H114Q153 19 151 70L144 166Z" fill="#2e5a86"/>
    <rect x="22" y="166" width="132" height="23" rx="10" fill="#22446a" stroke="#273b50" stroke-width="2.5"/>
  </symbol>
  <symbol id="laptop" viewBox="0 0 180 112">
    <path d="M12 7Q12 1 19 1H160Q167 1 167 8L169 97H10Z" fill="#b2bdcc" stroke="#34475c" stroke-width="3"/>
    <path d="M17 9H161V93H17Z" fill="#a5b1c2"/>
    <path d="M11 96H169L178 103Q179 108 169 109H10Q1 108 2 103Z" fill="#7c8da2" stroke="#34475c" stroke-width="2.5"/>
    <path d="M14 101H165" stroke="#c1cad5" stroke-width="2"/>
  </symbol>
  <symbol id="connector" viewBox="0 0 58 166">
    <!-- Straight sides meet continuously; the join never paints over a ficha. -->
    <path d="M29 2V124" stroke="#b79570" stroke-width="2"/>
    <rect x="11" y="138" width="36" height="25" rx="5" fill="#acb9ca" stroke="#34475c" stroke-width="2.5"/>
    <path d="M16 144H42" stroke="#e0e6ed" stroke-width="2"/>
  </symbol>
  <symbol id="plant" viewBox="0 0 118 255">
    <g stroke="#477454" stroke-width="2.4" stroke-linecap="round">
      <path d="M60 208Q58 121 45 36M61 188Q85 112 100 89M60 198Q35 138 16 129" fill="none"/>
      <path d="M49 129Q11 104 16 20Q49 11 59 64Q64 95 49 129Z" fill="#5d9264"/>
      <path d="M67 155Q67 92 111 68Q124 114 67 155Z" fill="#79a477"/>
      <path d="M49 180Q9 173 2 112Q43 114 49 180Z" fill="#83aa79"/>
      <path d="M63 193Q75 140 111 138Q110 179 63 193Z" fill="#64986b"/>
    </g>
    <path d="M29 200H91L83 247Q61 258 37 247Z" fill="#fffaf0" stroke="#d8d4c8" stroke-width="2"/>
    <ellipse cx="60" cy="201" rx="32" ry="6" fill="#d8d4c8"/>
    <path d="M59 201V187" stroke="#477454" stroke-width="3"/>
  </symbol>
  <symbol id="window" viewBox="0 0 570 245">
    <rect x="3" y="3" width="564" height="238" rx="11" fill="#a2bac7"/>
    <rect x="12" y="12" width="546" height="220" rx="5" fill="#cde6ee"/>
    <g fill="#b7d8e3">
      <path d="M12 231V167H50V138H83V181H119V118H150V178H183V157H216V231Z"/>
      <path d="M342 231V179H365V131H399V166H435V112H472V175H507V152H558V231Z"/>
    </g>
    <path d="M284 12V230" stroke="#a2bac7" stroke-width="7"/>
    <path d="M12 225H558" stroke="#e7f4f5" stroke-width="8"/>
    <rect x="1" y="235" width="568" height="10" rx="4" fill="#eef4ee"/>
  </symbol>
  <!-- Minimal purpose-built glyphs for the SVG office. All original geometric paths. -->
  <symbol id="icon-code" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></g></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></g></symbol>
  <symbol id="icon-file" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8M8 16h8"/></g></symbol>
  <symbol id="icon-brush" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 14 10-12 3 3-11 11ZM9 14C3 13 5 20 1 21c8 2 12-1 10-5"/></g></symbol>
  <symbol id="icon-flask" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8M10 2v7L4 19q-1 3 3 3h10q4 0 3-3L14 9V2M7 16h10"/></g></symbol>
  <symbol id="icon-crown" viewBox="0 0 24 24"><path d="m2 6 5 5 5-8 5 8 5-5-3 14H5Z" fill="currentColor"/></symbol>
  <symbol id="icon-browser" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20"/></g><circle cx="5" cy="5.5" r=".7" fill="currentColor"/><circle cx="8" cy="5.5" r=".7" fill="currentColor"/></symbol>
  <symbol id="icon-team" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="6" r="3.5"/><circle cx="3.5" cy="9" r="2.5"/><circle cx="20.5" cy="9" r="2.5"/><path d="M6 22v-5a6 6 0 0 1 12 0v5ZM0 20v-5a3.5 3.5 0 0 1 5-3v8Zm19 0v-8a3.5 3.5 0 0 1 5 3v5Z"/></g></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="icon-fit" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-return" viewBox="0 0 24 24"><path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-context" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7Zm-10 10 10 5 10-5M2 17l10 5 10-5"/></g></symbol>
  <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M2 5h7l2 3h11v13H2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="m7 3 14 9-14 9Z" fill="currentColor"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-alert" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 10 18H2ZM12 9v5"/><path d="M12 17v.1"/></g></symbol>
  <symbol id="icon-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></g></symbol>
  <symbol id="icon-hand" viewBox="0 0 24 24"><path d="M8 13V5q0-3 3-1v7-8q3-2 3 1v7-6q3-2 3 1v7-4q3-1 3 2v6q0 6-7 6h-1q-3 0-5-3l-4-5q-1-3 2-3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
