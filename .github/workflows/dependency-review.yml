# =============================================================================
# dependency-review — revisão de dependências em PRs · opensource-project
#
# NOTA (para o agente):
#   * Compara as dependências ADICIONADAS no PR com as bases de vulnerabilidade
#     (GitHub Advisory) e falha o PR acima da severidade configurada. Corre só
#     em `pull_request` — é aí que existe diff de dependências. O projeto tem
#     zero dependências runtime; o workflow protege o caso de as surgirem.
#   * `contents: read` basta para ler o diff.
#   * Actions fixadas por SHA (`bash scripts/oss-pin-actions.sh`).
# =============================================================================

name: dependency-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high # none|low|moderate|high|critical

      - name: Sumário do run
        run: echo "### dependency-review ✅" >> "$GITHUB_STEP_SUMMARY"
