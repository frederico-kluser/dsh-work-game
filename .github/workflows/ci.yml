# =============================================================================
# CI — dsh-work-game (frederico-kluser/dsh-work-game)
#
# Projeto zero dependências: não há `npm ci` nem build — o teste é `npm test`
# (node --test + Chrome/Chromium headless via CDP).
#
# NOTA (para o agente): as actions estão fixadas por SHA com
# `bash scripts/oss-pin-actions.sh`. Formato obrigatório em TODOS os `uses:`:
#     owner/repo@<PIN_SHA> # vX.Y.Z
#
# CONTEXT DE REQUIRED STATUS CHECK: o ruleset exige o NOME DO JOB `build`.
# A matriz gera nomes instáveis ("test (22, ubuntu-latest)"), por isso o job
# agregador `build` (nome estável) é o contexto exigido em
# .github/rulesets/regras-main.json → required_status_checks[].context.
# =============================================================================

name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

# Privilégio mínimo: o CI só precisa de ler o repositório.
permissions:
  contents: read

# Evita corridas duplicadas e desperdiçadas no mesmo PR/ramo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Browser disponível para os testes funcionais
        run: google-chrome --version

      - name: Testar
        run: npm test

  # Agregador estável: é o `context` exigido pelo ruleset de main.
  # Além de agregar a matriz de testes, valida as mensagens de commit (desde a
  # introdução da governança OSS em e7eb7e9): impõe Conventional Commits também
  # no servidor em qualquer plano do GitHub.
  build:
    name: build
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 30

      - name: Commits convencionais
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          header = re.compile(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))?!?: .+')
          skip = re.compile(r'^(Merge |Revert "|Reapply "|fixup!|squash!)')
          base_check = subprocess.run(['git', 'cat-file', '-e', 'e7eb7e9^{commit}'], capture_output=True)
          rev = 'e7eb7e9..HEAD' if base_check.returncode == 0 else '-n 5 HEAD'
          cmd = ['git', 'log', '--pretty=tformat:%s'] + rev.split()
          out = subprocess.run(cmd, capture_output=True, text=True).stdout
          bad = 0
          for s in out.splitlines():
              s = s.strip()
              if not s or skip.match(s):
                  continue
              h = re.sub(r'\s+\(#\d+\)$', '', s)
              if not header.match(h) or len(h) > 72:
                  print('ERRO: mensagem fora de Conventional Commits:', s); bad = 1
              else:
                  print('OK  :', s)
          sys.exit(bad)
          PY

      - name: Falhar se algum teste falhou
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test falhou: ${{ needs.test.result }}"
            exit 1
          fi
          echo "### build ✅ (testes verdes em node 22 e 24 + Commits Convencionais)" >> "$GITHUB_STEP_SUMMARY"
